name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm stylelint

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: pnpm dev
        env:
          CI: true
          # On-headless failure screenshots can hang (frozen CSS animations in
          # headless Electron), which times out the run; disable them and video.
          CYPRESS_SCREENSHOT_ON_RUN_FAILURE: 'false'
          CYPRESS_VIDEO: 'false'
